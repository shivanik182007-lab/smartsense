<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SmartSense Dashboard Login"
    >

    <title>SmartSense — Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Sora", "Segoe UI", Arial, Helvetica, sans-serif;

            background: #15171c;
            color: #eae7e2;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 380px;

            background: #1f232b;

            border: 1px solid #2b2f37;
            border-radius: 16px;

            padding: 36px 32px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;

            margin-bottom: 28px;
        }

        .brand-icon {
            width: 50px;
            height: 50px;

            border-radius: 12px;

            background: rgba(245, 166, 35, 0.12);

            border: 1.5px solid rgba(245, 166, 35, 0.35);

            color: #f5a623;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-text h1 {
            font-size: 21px;
            font-weight: 800;
            color: #eae7e2;
        }

        .brand-text p {
            font-size: 12.5px;
            color: #9a9691;
            margin-top: 2px;
        }

        h2 {
            font-size: 16px;
            font-weight: 700;
            color: #eae7e2;

            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13.5px;
            color: #9a9691;

            margin-bottom: 24px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;

            font-size: 13px;
            font-weight: 600;
            color: #c9c5be;

            margin-bottom: 6px;
        }

        .field input {
            width: 100%;

            padding: 12px 13px;

            border: 1px solid #33373f;
            border-radius: 9px;

            background: #181b21;
            color: #eae7e2;

            font-family: inherit;
            font-size: 14.5px;

            outline: none;

            transition: border-color 0.15s ease;
        }

        .field input:focus {
            border-color: #f5a623;
        }

        .error-message {
            background: rgba(239, 83, 80, 0.12);
            color: #ef5350;

            border-radius: 8px;

            padding: 10px 13px;

            font-size: 13.5px;

            margin-bottom: 18px;
        }

        .btn-login {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 9px;

            background: #f5a623;
            color: #15171c;

            font-family: inherit;
            font-size: 15px;
            font-weight: 800;

            cursor: pointer;

            transition: background 0.15s ease, transform 0.1s ease;
        }

        .btn-login:hover {
            background: #d68910;

            transform: translateY(-1px);
        }

        .footnote {
            margin-top: 22px;

            text-align: center;

            font-size: 12px;
            color: #6b6f76;
        }

    </style>

</head>

<body>

    <div class="login-card">

        <div class="brand">

            <div class="brand-icon">
                <svg
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <rect x="6" y="6" width="12" height="12" rx="1.5"></rect>
                    <rect x="9.5" y="9.5" width="5" height="5"></rect>
                    <line x1="9" y1="1.5" x2="9" y2="6"></line>
                    <line x1="15" y1="1.5" x2="15" y2="6"></line>
                    <line x1="9" y1="18" x2="9" y2="22.5"></line>
                    <line x1="15" y1="18" x2="15" y2="22.5"></line>
                    <line x1="18" y1="9" x2="22.5" y2="9"></line>
                    <line x1="18" y1="15" x2="22.5" y2="15"></line>
                    <line x1="1.5" y1="9" x2="6" y2="9"></line>
                    <line x1="1.5" y1="15" x2="6" y2="15"></line>
                </svg>
            </div>

            <div class="brand-text">
                <h1>SmartSense</h1>
                <p>IR + DHT22 Dashboard</p>
            </div>

        </div>

        <h2>Sign in</h2>
        <p class="subtitle">Enter your credentials to access the dashboard.</p>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login_submit') }}">

            <div class="field">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn-login">
                Sign In
            </button>

        </form>

        <p class="footnote">
            SmartSense 
        </p>

    </div>

</body>

</html>
